name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg (render, dźwięk, wydanie)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Zależności
        run: pip install -r requirements.txt pytest

      - name: Chromium dla Playwright
        run: python -m playwright install --with-deps chromium chrome

      # Testy przeglądarkowe potrzebują GSAP 3.12.5 (strony ładują go z CDN; test podstawia lokalną kopię z npm)
      - name: GSAP 3.12.5
        run: |
          npm pack gsap@3.12.5 --silent
          tar xzf gsap-3.12.5.tgz
          echo "GSAP_JS=$PWD/package/dist/gsap.min.js" >> "$GITHUB_ENV"

      - name: Testy
        run: python -m pytest -q
