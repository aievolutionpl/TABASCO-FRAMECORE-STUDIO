name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: FFmpeg Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Zależności
        run: pip install -r requirements.txt pytest
      - name: Chromium i Chrome Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium chrome
      - name: Chromium Windows (Chrome preinstalled on runner)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: GSAP 3.12.5
        shell: bash
        run: |
          npm pack gsap@3.12.5 --silent
          tar xzf gsap-3.12.5.tgz
          python -c "import os; from pathlib import Path; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('GSAP_JS='+str(Path('package/dist/gsap.min.js').resolve())+'\n')"
      - name: Testy
        run: python -m pytest -q --durations=10 --junitxml=output/pytest-results.xml
      - name: Raport testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ runner.os }}
          path: output/pytest-results.xml
