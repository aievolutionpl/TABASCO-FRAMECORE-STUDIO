name: Product website
on:
  push:
    branches: [main]
    paths: ['site/**','scripts/build-site.py','.github/workflows/pages.yml','assets/framecore-collaborative-editor.png','assets/framecore-visual-lesson-demo.mp4','assets/framecore-logo-mark.png']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: product-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public product website
        id: deployment
        uses: actions/deploy-pages@v4
