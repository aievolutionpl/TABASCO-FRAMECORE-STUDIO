<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vstudio - motion 1: hide the cut</title>
<!--
  Motion graphic 1/6 - "Hide the cut": jeden obiekt niesie cala animacje, nigdy nie ma cieca ani cross-fade.
  1080x1350, tlo #0B0E24, jedna os czasu GSAP 3.12.5, 7 s, repeat: -1, ease power3.inOut.
  Kropka -> ikona aplikacji -> ikona laduje w telefonie -> rosnie w ekran zamowienia -> wraca do kropki.

  Kontrakt strony vstudio: window.DURATION / window.seek(t) / window.EV / window.TEXTS(t) / window.__ready / window.__CAPTURE__
  Podglad: otworz plik w przegladarce (pętla startuje sama). Render: vstudio new ... --size 1080x1350 --duration 7,
  potem skopiuj plik do output/<marka>/<slug>/src/index.html.
  Uwaga: GSAP jest ladowany z CDN (adres z promptu) - render wymaga dostepu do cdnjs.cloudflare.com.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0E24; }
  /* scena 1080x1350 wysrodkowana marginesami (nie transform), skalowana do okna przez fit() */
  #stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1350px; margin: -675px 0 0 -540px;
           overflow: hidden; background: #0B0E24; transform-origin: 50% 50%;
           font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }

  /* telefon: kontur 10 px, ekran 420x880, srodek sceny = srodek telefonu */
  #phone { position: absolute; left: 320px; top: 225px; width: 440px; height: 900px; box-sizing: border-box;
           border: 10px solid #C9CEEA; border-radius: 72px; background: #10143A; overflow: hidden; }
  .tile { position: absolute; width: 84px; height: 84px; border-radius: 22px; background: rgba(255, 255, 255, .09); }
  .dock { position: absolute; left: 30px; top: 760px; width: 360px; height: 96px; border-radius: 34px; background: rgba(255, 255, 255, .07); }

  /* jedyny bohater: wysrodkowany flexboxem, animujemy width/height/border-radius w px */
  #center { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; display: flex; align-items: center; justify-content: center; }
  #morph { position: relative; flex: none; width: 0; height: 0; overflow: hidden; background: #fff; border-radius: 0; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #grad { background: linear-gradient(135deg, #5B97FF 0%, #2346E0 100%); }
  #bolt { flex: none; width: 120px; height: 120px; display: block; }
  /* tresc ekranu zamowienia siedzi WEWNATRZ rosnacego elementu, o stalym rozmiarze ekranu */
  #inner { flex: none; width: 420px; height: 880px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #tOrder { font-size: 34px; font-weight: 600; color: #8088AD; letter-spacing: .02em; }
  #tPlaced { font-size: 112px; font-weight: 800; color: #0B0E24; margin: 6px 0 44px; line-height: 1; }
  #tickCircle { flex: none; width: 150px; height: 150px; border-radius: 75px; background: #2F5BFF; display: flex; align-items: center; justify-content: center; }
  #tickCircle svg { width: 78px; height: 78px; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div class="tile" style="left:56px;top:98px"></div><div class="tile" style="left:280px;top:98px"></div>
    <div class="tile" style="left:56px;top:210px"></div><div class="tile" style="left:168px;top:210px"></div><div class="tile" style="left:280px;top:210px"></div>
    <div class="tile" style="left:56px;top:322px"></div><div class="tile" style="left:168px;top:322px"></div><div class="tile" style="left:280px;top:322px"></div>
    <div class="tile" style="left:56px;top:434px"></div><div class="tile" style="left:168px;top:434px"></div><div class="tile" style="left:280px;top:434px"></div>
    <div class="dock"></div>
  </div>
  <div id="center">
    <div id="morph">
      <div id="grad" class="layer"></div>
      <div id="boltLayer" class="layer">
        <svg id="bolt" viewBox="0 0 24 24"><path fill="#fff" d="M13.2 1.6 4.6 13.4h5.6L9 22.4l10.4-13.2h-6.2z"/></svg>
      </div>
      <div id="content" class="layer">
        <div id="inner">
          <div id="tOrder">Your order</div>
          <div id="tPlaced">Placed</div>
          <div id="tickCircle"><svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.6 10 17.5 19.2 7.2"/></svg></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  var DUR = 7, CAPTURE = !!window.__CAPTURE__;
  var stage = document.getElementById('stage');
  function fit() { stage.style.transform = 'scale(' + Math.min(innerWidth / 1080, innerHeight / 1350) + ')'; }

  gsap.config({ force3D: false });           /* transformacje 2D bez promocji warstw: raster klatki nie zalezy od historii seek */
  gsap.defaults({ ease: 'power3.inOut' });
  var tl = gsap.timeline({ repeat: -1, paused: CAPTURE });

  /* stany startowe: wszystko ustawiane w czasie 0 osi, wiec kazda petla resetuje sie czysto */
  tl.set('#morph', { width: 0, height: 0, borderRadius: 0, backgroundColor: '#ffffff', x: 0, y: 0 }, 0)
    .set('#grad', { opacity: 0 }, 0)
    .set('#boltLayer', { opacity: 0 }, 0)
    .set('#bolt', { width: 120, height: 120 }, 0)
    .set('#content', { opacity: 0 }, 0)
    .set('#tickCircle', { scale: 0 }, 0)
    .set('#phone', { y: 1130 }, 0);

  /* 1. 0-0.7: biala kropka wyskakuje w centrum */
  tl.to('#morph', { width: 28, height: 28, borderRadius: 14, duration: 0.7 }, 0);

  /* 2. 0.7-1.5: kropka rosnie w ikone (niebieski gradient, biala blyskawica) */
  tl.to('#morph', { width: 220, height: 220, borderRadius: 52, duration: 0.8 }, 0.7)
    .to('#grad', { opacity: 1, duration: 0.8 }, 0.7)
    .to('#boltLayer', { opacity: 1, duration: 0.5 }, 0.9);

  /* 3. 1.5-2.7: telefon wjezdza od dolu, ikona maleje i laduje na jego ekranie glownym */
  tl.to('#phone', { y: 0, duration: 1.2 }, 1.5)
    .to('#morph', { width: 84, height: 84, borderRadius: 22, y: -300, duration: 1.2 }, 1.5)
    .to('#bolt', { width: 46, height: 46, duration: 1.2 }, 1.5);

  /* 4. 2.7-3.6: ikona rosnie na caly ekran telefonu i jasnieje (#F4F6FF); tresc ukryta w trakcie wzrostu,
        wjezdza od 3.2 s, ptaszek wyskakuje 3.4 s */
  tl.to('#morph', { width: 420, height: 880, borderRadius: 62, y: 0, backgroundColor: '#F4F6FF', duration: 0.9 }, 2.7)
    .to('#grad', { opacity: 0, duration: 0.5 }, 2.7)
    .to('#boltLayer', { opacity: 0, duration: 0.3 }, 2.7)
    .to('#content', { opacity: 1, duration: 0.3 }, 3.2)       /* start 3.2 s: dopiero gdy element jest na tyle szeroki, by nie ciac tekstu */
    .to('#tickCircle', { scale: 1, duration: 0.3 }, 3.4)
    .to('#tickCircle', { scale: 1.06, duration: 0.7 }, 3.7)                          /* oddech w trakcie trzymania: */
    .to('#tickCircle', { scale: 1, duration: 0.7 }, 4.4);                            /* dwa jawne tweeny, bez yoyo/repeat (determinizm) */

  /* 5. 5.0-6.2: tresc znika, ekran zapada sie z powrotem w biala kropke, telefon zjezdza w dol */
  tl.to('#content', { opacity: 0, duration: 0.3 }, 5.0)
    .to('#morph', { width: 28, height: 28, borderRadius: 14, backgroundColor: '#ffffff', duration: 1.2 }, 5.0)
    .to('#phone', { y: 1130, duration: 1.2 }, 5.0);

  /* domkniecie petli: kropka gasnie do zera, bo o 0 s wyskakuje od zera */
  tl.to('#morph', { width: 0, height: 0, borderRadius: 0, duration: 0.5 }, 6.5);
  tl.set({}, {}, DUR);                       /* os trwa dokladnie 7 s */

  /* ---------- haki vstudio ---------- */
  if (CAPTURE) { tl.totalTime(DUR - 0.001, false); tl.totalTime(0, false); }   /* rozgrzewka: inicjalizuje wszystkie tweeny po kolei */
  window.DURATION = DUR;
  window.seek = function (t) { tl.pause(); tl.totalTime(((t % DUR) + DUR) % DUR, false); };
  window.EV = [
    { t: 0.05, type: 'pop' }, { t: 0.75, type: 'whoosh' }, { t: 1.5, type: 'whoosh' },
    { t: 2.7, type: 'whoosh' }, { t: 3.4, type: 'chime' }, { t: 5.0, type: 'whoosh' }, { t: 6.5, type: 'pop' }
  ];

  var TXT = [['your-order', '#tOrder'], ['placed', '#tPlaced']];
  function visibleBox(el) {                  /* tekst widoczny (opacity >= .5) i przyciety przez rodzicow z overflow */
    var rg = document.createRange(); rg.selectNodeContents(el);
    var r = rg.getBoundingClientRect(), o = 1;
    for (var n = el; n && n !== document.body; n = n.parentElement) {
      var cs = getComputedStyle(n); o *= parseFloat(cs.opacity);
      if (n !== el && cs.overflow !== 'visible') {
        var c = n.getBoundingClientRect();
        r = { left: Math.max(r.left, c.left), top: Math.max(r.top, c.top), right: Math.min(r.right, c.right), bottom: Math.min(r.bottom, c.bottom) };
      }
    }
    return (o < 0.5 || r.right <= r.left || r.bottom <= r.top) ? null : r;
  }
  window.TEXTS = function () {
    var out = [];
    TXT.forEach(function (it) {
      var el = document.querySelector(it[1]), b = visibleBox(el);
      if (b) out.push({ id: it[0], text: el.textContent.trim(), x0: b.left, y0: b.top, x1: b.right, y1: b.bottom });
    });
    return out;
  };
  window.__ready = document.fonts.ready.then(fit);
  fit();
  if (!CAPTURE) addEventListener('resize', fit);
})();
</script>
</body>
</html>
