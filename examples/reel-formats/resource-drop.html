  Format rolki "polecajka narzędzia" (tool-drop), 1080x1920, 16 s, GSAP 3.12.5.
  Bity (director_plan format=tool-drop): hak 0-2.4 s (napisy nad nagraniem) | demo 2.4-5.6 s (okno przeglądarki + wordmark) |
  karta zasobu 5.6-9.4 s (ikona, plakietka DARMOWY, komenda wpisywana w terminalu) | korzyści 9.4-12.6 s | CTA "skomentuj słowo" 12.6-16 s.
  Czasy są dobrane do czasu czytania (znaki / 15 + 1,5 s): każdy napis zostaje na ekranie dość długo, żeby dało się go przeczytać.

  Układ: nagranie twórcy w dolnych ~55% kadru (tu: placeholder), karty i okno na scenie powyżej, napisy słowo po słowie na styku.
  Podmień: nazwę produktu, adres, komendę, opisy i słowo CTA (zmienne w sekcji CONTENT na dole); napisy zbuduj narzędziem captions_build
  z własnego tekstu lub SRT. Własne nagranie: zrenderuj scenę jako nakładkę z przezroczystością (render_start overlay: true) i złóż w montażu;
  w trybie nakładki znikają tło i placeholder nagrania (window.__ALPHA__).

  Kontrakt strony vstudio: window.DURATION / seek(t) / EV / TEXTS(t) / __ready / __CAPTURE__. Zestaw ruchu (sprężyny, krzywe, napisy) wchodzi ze znacznika poniżej.
  Uwaga: GSAP ładowany z CDN (cdnjs); do pracy offline: vendor add gsap.
-->

  gsap.config({ force3D: false });
  var tl = gsap.timeline({ repeat: -1, paused: CAPTURE });
  var out = VS.ease.out, io = VS.ease.inOut, sp = VS.spring(220, 16), spd = VS.springDuration(220, 16), sp2 = VS.spring(300, 22), spd2 = VS.springDuration(300, 22);

  /* stany startowe, wszystkie w czasie 0 osi */
  tl.set('#tile', { opacity: 0, y: -70, scale: .8 }, 0)
    .set('#win', { opacity: 0, y: -60, scale: .98 }, 0)
    .set('#scroll', { y: 0 }, 0).set('#zoom', { scale: 1 }, 0)
    .set('#mark', { opacity: 0, filter: 'blur(18px)', letterSpacing: '.08em' }, 0)
    .set('#card', { opacity: 0, y: -50, scale: 1 }, 0)
    .set('#ico', { scale: .6, opacity: 0 }, 0).set('#name,#repo,#desc', { opacity: 0, y: 14 }, 0)
    .set('#pill', { scale: .5, opacity: 0 }, 0).set('#cmdBox', { opacity: 0 }, 0)
    .set('.row', { opacity: 0, x: -50 }, 0).set('.row .ck', { scale: .4 }, 0)
    .set('#bubble', { scale: .5, opacity: 0 }, 0).set('#c1,#c3', { opacity: 0, y: 18 }, 0).set('#kw', { scale: .7, opacity: 0 }, 0)
    .set('#fpush', { scale: 1 }, 0).set('#b1,#b2', { x: 0, y: 0 }, 0)
    .set('#ping', { opacity: 0, scale: .6 }, 0);

  /* nagranie powoli najeżdża, plamy pod nim dryfują tam i z powrotem */
  tl.to('#fpush', { scale: 1.05, duration: DUR, ease: 'none' }, 0)
    .to('#b1', { x: 90, y: -70, duration: 8, ease: 'sine.inOut' }, 0).to('#b1', { x: 0, y: 0, duration: 8, ease: 'sine.inOut' }, 8)
    .to('#b2', { x: -80, y: 60, duration: 8, ease: 'sine.inOut' }, 0).to('#b2', { x: 0, y: 0, duration: 8, ease: 'sine.inOut' }, 8);

  /* panele nastroju: pomarańcz (hak) -> błękit (demo) -> żółć, potem ciepły pomarańcz (karta) -> fiolet, potem róż (korzyści) -> ciemny (CTA) */
  function mood(id, inAt, outAt) {
    tl.to(id, { opacity: 1, duration: .5, ease: io }, inAt);
    if (outAt != null) tl.to(id, { opacity: 0, duration: .5, ease: io }, outAt);
  }
  tl.to('#pn1', { opacity: 0, duration: .5, ease: io }, 2.3);
  mood('#pn2', 2.3, 5.5); mood('#pn3', 5.5, 7.4); mood('#pn3b', 7.4, 9.3); mood('#pn4', 9.3, 11.0); mood('#pn4b', 11.0, 12.5); mood('#pn5', 12.5, null);

  /* bit 1 (0-2.4): kafelek ikony spada ze sprężyną */
  tl.to('#tile', { opacity: 1, duration: .3, ease: out }, .15)
    .to('#tile', { y: 0, scale: 1, duration: spd, ease: sp }, .15)
    .to('#tile', { opacity: 0, scale: .9, duration: .25, ease: out }, 2.2);

  /* bit 2 (2.4-5.6): okno przeglądarki, treść przewija się i najeżdża, wordmark wchodzi z rozmycia */
  tl.to('#win', { opacity: 1, y: 0, scale: 1, duration: .5, ease: out }, 2.45)
    .to('#scroll', { y: -150, duration: 2.4, ease: io }, 2.9)
    .to('#zoom', { scale: 1.14, duration: 2.4, ease: io }, 2.9)
    .to('#mark', { opacity: 1, filter: 'blur(0px)', letterSpacing: '0em', duration: .7, ease: out }, 2.75)
    .to('#win', { opacity: 0, y: -30, scale: .96, duration: .3, ease: out }, 5.4)
    .to('#mark', { opacity: 0, duration: .25, ease: out }, 5.45);

  /* bit 3 (5.6-9.4): karta zasobu; plakietka na sprężynie, komenda wpisywana w seek() */
  tl.to('#card', { opacity: 1, y: 0, duration: .5, ease: out }, 5.65)
    .to('#ico', { opacity: 1, duration: .3, ease: out }, 5.8).to('#ico', { scale: 1, duration: spd, ease: sp }, 5.8)
    .to('#name', { opacity: 1, y: 0, duration: .4, ease: out }, 5.95)
    .to('#repo', { opacity: 1, y: 0, duration: .4, ease: out }, 6.05)
    .to('#pill', { opacity: 1, duration: .2, ease: out }, 6.15).to('#pill', { scale: 1, duration: spd, ease: sp }, 6.15)
    .to('#cmdBox', { opacity: 1, duration: .3, ease: out }, 6.15)
    .to('#desc', { opacity: 1, y: 0, duration: .45, ease: out }, 6.35)
    .to('#card', { opacity: 0, scale: .96, duration: .25, ease: out }, 9.2);

  /* bit 4 (9.4-12.6): trzy korzyści z haczykami, z opóźnieniem */
  [1, 2, 3].forEach(function (i) {
    var t0 = 9.5 + (i - 1) * .22;
    tl.to('#r' + i, { opacity: 1, x: 0, duration: .45, ease: out }, t0)
      .to('#r' + i + ' .ck', { scale: 1, duration: spd, ease: sp }, t0 + .1);
  });
  tl.to('.row', { opacity: 0, x: 30, duration: .25, ease: out }, 12.3);

  /* bit 5 (12.6-16): CTA: słowo w dużej plakietce, potem trzymamy w bezruchu */
  tl.to('#bubble', { opacity: 1, duration: .2, ease: out }, 12.65).to('#bubble', { scale: 1, duration: spd2, ease: sp2 }, 12.65)
    .to('#c1', { opacity: 1, y: 0, duration: .35, ease: out }, 12.75)
    .to('#kw', { opacity: 1, duration: .2, ease: out }, 12.9).to('#kw', { scale: 1, duration: spd2, ease: sp2 }, 12.9)
    .to('#c3', { opacity: 1, y: 0, duration: .35, ease: out }, 13.1)
    .to('#ping', { opacity: .9, duration: .01 }, 14.3).to('#ping', { scale: 3.4, duration: .9, ease: out }, 14.3).to('#ping', { opacity: 0, duration: .8, ease: io }, 14.4);

  tl.set({}, {}, DUR);
  if (CAPTURE) { tl.totalTime(DUR - 0.001, false); tl.totalTime(0, false); }

  /* zdarzenia dźwiękowe: z nich powstaje cue sheet */
  window.EV = [{ t: .2, type: 'hit' }, { t: 2.45, type: 'whoosh' }, { t: 2.75, type: 'pop' }, { t: 5.65, type: 'whoosh' }, { t: 5.85, type: 'pop' }, { t: 6.2, type: 'pop' },
    { t: 6.4, type: 'type' }, { t: 9.5, type: 'tick' }, { t: 9.72, type: 'tick' }, { t: 9.94, type: 'tick' }, { t: 7.4, type: 'pop' }, { t: 11.0, type: 'pop' }, { t: 12.65, type: 'hit' }, { t: 13.0, type: 'chime' }, { t: 14.3, type: 'pop' }];
  window.DURATION = DUR;

  VS.captions.mount($('#cap'), CAPTIONS, { style: 'single' });
  var ghostRect = null;
  function measureGhost() { var r = document.createRange(); r.selectNodeContents($('#cmdGhost').firstChild); var b = r.getBoundingClientRect(); ghostRect = { dx: b.left, dy: b.top, w: b.width, h: b.height }; }

  function wrap(t) { return ((t % DUR) + DUR) % DUR; }
  window.seek = function (t) {
    t = wrap(t);
    tl.pause(); tl.totalTime(t, false);
    $('#cmdText').textContent = VS.type(CONTENT.cmd, t, 6.2, 26);
    VS.captions.draw(t);
  };

  /* TEXTS(t): każdy widoczny napis z boksem, czytany z DOM; komenda zgłaszana w pełnej długości (układ jest stały) */
  function eff(e) { var o = 1; for (; e && e.nodeType === 1; e = e.parentElement) o *= parseFloat(getComputedStyle(e).opacity); return o; }
  window.TEXTS = function (t) {
    var out = [];
    [].slice.call(document.querySelectorAll('.t')).forEach(function (el, i) {
      if (!el.textContent || eff(el) < 0.05 || el.id === 'cmdText') return;
      var r = document.createRange(); r.selectNodeContents(el); var b = r.getBoundingClientRect();
      out.push({ id: el.id || ('t' + i), text: el.textContent, x0: b.left, y0: b.top, x1: b.right, y1: b.bottom });
    });
    var c = $('#cmdText');
    if (ghostRect && eff(c) > 0.05 && c.textContent) {
      var o = c.getBoundingClientRect();
      out.push({ id: 'cmd', text: CONTENT.cmd, x0: o.left, y0: o.top, x1: o.left + ghostRect.w, y1: o.bottom });
    }
    return out.concat(VS.captions.texts(t));
  };

  window.__ready = document.fonts.ready.then(function () { fit(); measureGhost(); });
  fit();
  if (!CAPTURE) {
    addEventListener('resize', fit);
    var t0 = performance.now();
    (function loop() { window.seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); })();
  }
})();
</script>
</body>
